<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Seguridad: la página solo carga sus propios archivos (scripts, estilos, fuentes).
     Las imágenes pueden venir de internet (miniaturas de YouTube). Si algún día se
     colara un <script> en un título, el navegador no lo ejecutaría.
     'unsafe-eval' hace falta: pywebview en Linux (GTK) usa eval() para hablar con la página. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Onitune</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Primer arranque: descarga de yt-dlp, ffmpeg y Deno -->
  <div id="setup" hidden></div>

  <!-- Ventana principal -->
  <div id="main" hidden>
    <nav id="rail">
      <div class="brand">
        <img id="logo" alt="">
        <div>
          <div class="brand-name">Onitune</div>
          <div class="brand-sub" data-t="rail.subtitle"></div>
        </div>
      </div>
      <div id="destinations"></div>
      <div class="rail-space"></div>
      <!-- data-t="clave": app.js pone el texto en el idioma elegido -->
      <div class="status-card">
        <div class="status-line"><span class="dot" id="dot-ytdlp"></span><span id="txt-ytdlp" data-t="rail.ytdlp_ok"></span></div>
        <div class="status-line"><span class="dot ok"></span><span data-t="rail.ffmpeg_ok"></span></div>
        <div class="status-line"><span class="dot info"></span><span id="txt-queue" data-t="rail.idle"></span></div>
      </div>
    </nav>

    <section id="content">
      <div id="banners"></div>
      <div id="scroll">
        <div class="view" id="view-audio"></div>
        <div class="view" id="view-video"></div>
        <div class="view" id="view-queue"></div>
        <div class="view" id="view-history"></div>
        <div class="view" id="view-settings"></div>
      </div>
    </section>
  </div>

  <div id="dialogs"></div>
  <div id="toasts"></div>
  <div id="tip" role="tooltip"></div>

  <script src="app.js"></script>
</body>
</html>
